name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10.14'
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest
