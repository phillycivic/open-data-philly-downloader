[project]
name = "open-data-philly-downloader"
version = "0.2.1"
description = "Download any OpenDataPhilly Carto table to SQLite or CSV."
authors = [{name = "Stephen Suffian", email = "stephen.suffian@pm.me"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10.4"
dependencies = [
    "click>=8.1,<9",
    "requests>=2.31,<3",
]

[project.urls]
Homepage = "https://github.com/phillycivic/open-data-philly-downloader"
Issues = "https://github.com/phillycivic/open-data-philly-downloader/issues"

[project.scripts]
odp-download = "odp_downloader.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/odp_downloader"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"
